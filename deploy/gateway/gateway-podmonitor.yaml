apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: gateway
  namespace: inference-guard
  labels:
    app: gateway
    app.kubernetes.io/part-of: inference-guard
spec:
  selector:
    matchLabels:
      app: gateway
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s

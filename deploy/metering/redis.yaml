# Redis for token budgets + usage accounting. Dev-grade: no persistence
# (budgets are short-lived windows; usage keys carry a 30-day TTL and can be
# rebuilt by re-consuming the Kafka topic).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: inference-guard
  labels:
    app: redis
    app.kubernetes.io/part-of: inference-guard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/part-of: inference-guard
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          # Budget keys must never be evicted: noeviction + a memory cap.
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - noeviction
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: inference-guard
  labels:
    app: redis
    app.kubernetes.io/part-of: inference-guard
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: inference-guard
spec:
  template:
    spec:
      nodeSelector: null
      tolerations: null
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
      containers:
        - name: vllm
          image: vllm/vllm-openai-cpu:v0.33.0
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
          env:
            - name: VLLM_CPU_KVCACHE_SPACE
              value: "2"
            - name: OMP_NUM_THREADS
              value: "4"
          args:
            - --model=Qwen/Qwen2.5-0.5B-Instruct
            - --max-model-len=8192
            - --enforce-eager
            - --disable-log-requests
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 600
            periodSeconds: 30
            failureThreshold: 10
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 10Gi
              nvidia.com/gpu: null